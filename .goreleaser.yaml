version: 2

project_name: segcheck

before:
  hooks:
    - go mod tidy

builds:
  - id: segcheck
    main: ./cmd/segcheck
    binary: segcheck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

# SC-44: one multi-arch image, so `docker run ghcr.io/allan-nava/segcheck:vX.Y.Z`
# resolves on amd64 and arm64 alike. The binaries are the ones goreleaser already
# built for the archives — Dockerfile.release only packages them, so an image and
# its archive can never be different builds.
#
# dockers_v2 rather than dockers/docker_manifests: those are deprecated and
# `goreleaser check` fails on them, which would turn the first release tag into
# the moment we found out.
dockers_v2:
  - id: segcheck
    images:
      - "ghcr.io/allan-nava/segcheck"
    tags:
      - "{{ .Version }}"
      # :latest stays where it is when the tag is a prerelease.
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.release
    labels:
      org.opencontainers.image.title: segcheck
      org.opencontainers.image.description: Check what HLS/DASH segments really contain, not just what the manifest says
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/Allan-Nava/segcheck
      org.opencontainers.image.licenses: PolyForm-Noncommercial-1.0.0

# SC-47: "zero dependencies" should be something a consumer can verify rather
# than something the README asserts, and a signature is what lets someone who
# did not build it trust the binary they downloaded.
sboms:
  - id: archive
    artifacts: archive

signs:
  - id: checksum
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - id: images
    cmd: cosign
    args: ["sign", "--yes", "${artifact}"]
    artifacts: manifests
    output: true

# SC-32: live. HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to homebrew-tap
# with Contents: read and write — the workflow's own GITHUB_TOKEN is scoped to
# this repository and cannot write to another one. The token expires (fine-
# grained PATs must); when it does, a release will publish its archives and
# image and then fail here.
#
# A cask, not a formula: `brews` is deprecated, and Homebrew wants a cask for a
# prebuilt binary anyway — a formula describes something built from source.
# Casks are macOS-only. SC-65 decided not to carry a formula alongside for Linux
# Homebrew: `go install`, the archives and the image already cover that audience,
# and a second packaging path exists to be the one that goes stale. goreleaser
# emits `on_linux` URLs into the cask regardless; Homebrew on Linux refuses casks
# outright, so those blocks are inert rather than a working install.
homebrew_casks:
  - name: segcheck
    binaries: [segcheck]
    repository:
      owner: Allan-Nava
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Allan-Nava/segcheck"
    description: "Check what HLS/DASH segments really contain, not just what the manifest says"
    license: "PolyForm-Noncommercial-1.0.0"

    # SC-65: Homebrew Cask stamps com.apple.quarantine on everything it stages,
    # and the binary is ad-hoc signed — the Go linker does that on arm64, it is
    # not a Developer ID signature — so Gatekeeper rejects it. The failure mode is
    # the reason this is worth fixing rather than documenting: `brew install
    # --cask` reports success, and then the first run dies on SIGKILL, exit 137,
    # with no output at all. Not the "developer cannot be verified" dialog a GUI
    # app gets — nothing. From a terminal that reads as a broken build, and the
    # person who reports it will report the wrong bug. SC-94 is the real fix and
    # needs a paid Developer ID; stripping the attribute makes the cask work now.
    #
    # `/usr/bin/xattr` by absolute path, never bare `xattr`: a Homebrew or conda
    # Python `xattr` earlier on PATH does not accept `-r` and the hook would fail
    # on exactly the machines most likely to have one. `-dr` rather than `-d`
    # because it exits 0 when the attribute is already absent — a reinstall, or
    # HOMEBREW_NO_QUARANTINE — whereas `-d` exits 1 with "No such xattr", and a
    # postflight that fails on a clean install is worse than the problem it fixes.
    #
    # `.exit_status.zero?` rather than `== 0`: `brew style` runs RuboCop over the tap
    # and Style/NumericPredicate fails the audit on the comparison. The cask is
    # generated from here, so correcting it in the tap by hand lasts until the next
    # release overwrites it.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status.zero?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/segcheck"]
          end

changelog:
  # CHANGELOG.md is written by hand and is the source of truth; the release notes
  # should not compete with it.
  disable: true

release:
  draft: false
  prerelease: auto
  footer: |
    ---
    Full notes: [CHANGELOG.md](https://github.com/Allan-Nava/segcheck/blob/main/CHANGELOG.md)
