<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="segcheck — check what your HLS/DASH segments actually contain">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="0.6" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.16" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-plate" x1="72" y1="72" x2="248" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17274a"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="og-seg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="og-check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <g transform="translate(72 64) scale(0.34)">
    <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#og-plate)"/>
    <rect x="8.75" y="8.75" width="494.5" height="494.5" rx="115.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
    <g fill="url(#og-seg)">
      <rect x="60"  y="144" width="88" height="52" rx="16"/>
      <rect x="160" y="144" width="88" height="52" rx="16"/>
      <rect x="60"  y="230" width="88" height="52" rx="16"/>
      <rect x="60"  y="316" width="88" height="52" rx="16"/>
      <rect x="160" y="316" width="88" height="52" rx="16"/>
    </g>
    <rect x="163.5" y="233.5" width="81" height="45" rx="13" fill="none"
          stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-dasharray="20 14"/>
    <path d="M280 272 L328 324 L428 204" fill="none" stroke="url(#og-check)"
          stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="272" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-3">
    <tspan fill="#f1f5f9">seg</tspan><tspan fill="#10b981">check</tspan>
  </text>
  <text x="276" y="222" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"
        font-size="26" fill="#93a4bd" letter-spacing="1">one static Go binary · zero dependencies</text>

  <text x="72" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="600" fill="#dbe4f0">Check what your segments <tspan fill="#5eead4">actually contain</tspan></text>
  <text x="72" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="600" fill="#dbe4f0">— not what the manifest claims.</text>

  <!-- a findings strip: the shape of the output, legible at thumbnail size -->
  <g font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <rect x="72" y="446" width="1056" height="120" rx="18" fill="#0d1626" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="104" cy="484" r="8" fill="#f87171"/>
    <text x="128" y="493" fill="#dbe4f0">BAD   continuity  1080p seg 412   gap +512ms, no discontinuity</text>
    <circle cx="104" cy="530" r="8" fill="#f87171"/>
    <text x="128" y="539" fill="#dbe4f0">BAD   resolution  1080p           declares 1920x1080, codes 1280x720</text>
  </g>
</svg>
