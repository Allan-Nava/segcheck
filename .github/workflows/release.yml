name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # SC-44: pushing the image to GHCR.
  packages: write
  # SC-47: cosign keyless signing exchanges this token for a certificate, which
  # is what makes the signature verifiable without anyone holding a private key.
  id-token: write

jobs:
  # SC-36. Every false positive this project has shipped was found by running
  # against a reference stream rather than by a unit test, and the step was
  # manual — which is exactly the kind of step that gets skipped on the day it
  # would have mattered. A tag does not ship without it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: The reference streams
        run: |
          go build -o /tmp/segcheck ./cmd/segcheck
          SEGCHECK_BIN=/tmp/segcheck go test -tags smoke -run TestSmokeReferenceStreams ./internal/analyze/ -v

  goreleaser:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      # Dockerfile.release has no RUN steps — it only copies a binary goreleaser
      # already cross-compiled — so arm64 needs no emulation to build. QEMU is
      # set up anyway so that stops being true silently if a RUN ever appears.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SC-32: the cask publishes to Allan-Nava/homebrew-tap, which this
          # workflow's GITHUB_TOKEN cannot write to. Fine-grained PATs expire, and
          # when this one does a release will publish its archives and image and
          # then fail at the cask step — the artifacts are fine, the tap is stale.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The published image answers to the same contract as the one CI builds from
  # source, so it is checked with the same test rather than a different one.
  verify-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test the published image
        # goreleaser tags images with {{ .Version }}, which is the git tag
        # *without* its leading v — ghcr.io/…:0.1.1, never :v0.1.1. Using
        # github.ref_name verbatim asks for an image that was never published,
        # and the job fails with "manifest unknown" on a release that is fine.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export SEGCHECK_IMAGE="ghcr.io/allan-nava/segcheck:${TAG#v}"
          echo "verifying $SEGCHECK_IMAGE"
          docker pull "$SEGCHECK_IMAGE"
          go test -tags docker -run TestDockerImage ./internal/analyze/ -v
