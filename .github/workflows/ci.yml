name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The parsers are the whole product, and the concurrency around the
      # segment fan-out writes into a shared slice, so both matter.
      #
      # scripts/coverage.sh merges the -coverpkg profile before measuring, which
      # `go tool cover -func` does not do, and then ratchets (SC-48): it fails if
      # coverage dropped below the figure recorded in scripts/coverage.floor, and
      # also if it rose enough to be worth locking in. The floor is committed, so
      # moving it is a reviewable diff rather than a number buried in this file.
      # The ratchet decides whether the build fails, so its decision table is
      # asserted before it is trusted to make that call.
      - name: The coverage ratchet's own tests
        run: sh scripts/coverage_test.sh

      - name: Test with coverage, ratcheted
        run: |
          summary=$(./scripts/coverage.sh check)
          echo "$summary"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Test with the race detector
        run: go test -race ./...

      - run: go build ./...

      # No dependencies is a property worth defending: it is why the binary is
      # static, small and auditable. A stray require would end that quietly.
      - name: Still zero dependencies
        run: |
          if [ -f go.sum ] && [ -s go.sum ]; then
            echo "::error::go.sum is non-empty — segcheck is meant to have no dependencies"
            cat go.sum
            exit 1
          fi
          if grep -qE '^\s*(require|replace)\b' go.mod; then
            echo "::error::go.mod declares requirements — segcheck is meant to have no dependencies"
            cat go.mod
            exit 1
          fi

  # SC-45: the image is part of how segcheck is delivered, so it gets tested
  # like anything else. An image that cannot reach an origin over TLS, or that
  # ships a shell, or that runs as root, is a defect even when every unit test
  # is green — and none of those show up in `go test ./...`.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build the image
        run: docker build -t segcheck:test --build-arg VERSION=ci-${{ github.sha }} .

      - name: Image smoke test
        env:
          SEGCHECK_IMAGE: segcheck:test
        run: go test -tags docker -run TestDockerImage ./internal/analyze/ -v

      # A release config that only gets validated when a tag is pushed is a
      # config that fails at the worst moment. `check` also fails on deprecated
      # properties, which is how they get migrated on a normal PR instead.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # BACKLOG.md is the single source of truth for planned work and ROADMAP.md is
  # generated from it. A stale roadmap is a lie about what is planned, so the
  # generator runs here rather than on trust.
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the backlog
        run: ./scripts/backlog.sh lint
      - name: ROADMAP.md is in sync with BACKLOG.md
        run: ./scripts/backlog.sh check
      # The issue sync decides what to create and what to close, and it runs on
      # a push with issues:write. Its planner is asserted against a fixture
      # backlog here so a regression shows up before it opens duplicates or
      # closes live issues.
      - name: The issue planner
        run: sh scripts/backlog_issues_test.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/segcheck
