name: Pages

# SC-33: publishes docs/ to GitHub Pages. The site is a single static file with
# no build step and no external requests, so there is nothing to install here —
# the job uploads the directory as it is committed.
#
# Requires Settings → Pages → Source = "GitHub Actions" on the repository.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight, so a push during a
# deploy queues rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history, not the default single commit. The lastmod check reads the
      # last commit that touched docs/index.html, and a depth-1 clone has no
      # history to read — the gate would skip silently and pass on a stale date,
      # which is the failure it exists to catch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Never publish a site whose sitemap names a URL that is not there: the
      # host root's robots.txt declares this sitemap, and a dead URL in it
      # wastes crawl budget on every crawl.
      - name: The SEO files agree with the page
        run: sh scripts/seo.sh check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
